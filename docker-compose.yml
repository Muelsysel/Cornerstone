services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cornerstone-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - cornerstone-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: cornerstone-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=cornerstone
      - TZ=Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - cornerstone-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - cornerstone-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcornerstone"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: cornerstone-redis
    ports:
      - "6379:6379"
    volumes:
      - cornerstone-redis-data:/data
    networks:
      - cornerstone-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 前端：多阶段构建（node 构建 → nginx 托管），反代 /auth /system /demo 到宿主机网关
  # 构建：docker compose up --build frontend；访问 http://localhost:8088
  # 说明：后端服务当前在宿主机本地运行（网关 8080），容器内经 host-gateway 访问；
  #       若后端也容器化，把 nginx.conf 的 proxy_pass 改为 http://cornerstone-gateway:8080
  frontend:
    build: ./cornerstone-web
    image: cornerstone-frontend:latest
    container_name: cornerstone-frontend
    ports:
      - "8088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cornerstone-net

volumes:
  cornerstone-mysql-data:
  cornerstone-redis-data:

networks:
  cornerstone-net:
    driver: bridge
