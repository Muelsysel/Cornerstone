springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cornerstone.system: info

# Actuator：克制暴露，仅 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
