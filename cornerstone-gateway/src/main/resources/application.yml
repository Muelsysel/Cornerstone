server:
  port: 8080

spring:
  application:
    name: cornerstone-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
    gateway:
      # 全局 CORS：仅允许本地开发/演示来源（生产经 nginx 同源反代，不触发 CORS）。
      # 收紧为白名单：与 allow-credentials: true 搭配时不能使用 '*' 通配来源。
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - 'http://localhost:5173' # 前端 dev server
              - 'http://127.0.0.1:5173'
              - 'http://localhost:8088' # 前端 nginx 容器
              - 'http://127.0.0.1:8088'
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true

# 网关 JWT 校验公钥（与认证中心使用同一 RSA 公钥）
cornerstone:
  gateway:
    jwt:
      public-key: classpath:rsa-public.pem
    # 受信反代 IP（逗号分隔，默认空）：仅当直连对端在此列表时，限流键取 X-Forwarded-For 首值还原真实客户端。
    # 生产经 nginx 容器（8088）反代时填入 nginx 容器 IP（如 docker inspect 查 bridge IP），否则所有用户共享一个限流桶。
    trusted-proxy-ips: ""

# Actuator：克制暴露，仅 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
