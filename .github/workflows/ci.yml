name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Run tests
        run: mvn -q test

      - name: Spotless check
        run: mvn -q spotless:check

      - name: Documentation integrity check
        run: bash scripts/check-docs.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cornerstone-web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cornerstone-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests
        run: npm test
