spring:
  cloud:
    nacos:
      discovery:
        # 测试不连 Nacos
        enabled: false
  datasource:
    # H2 MySQL 兼容模式跑 Flyway：测试不依赖真实 MySQL
    url: jdbc:h2:mem:demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

# 测试隔离：用测试密钥对，与主配置（生产公钥）解耦
