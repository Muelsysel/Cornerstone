server:
  port: 8081

spring:
  application:
    name: cornerstone-auth
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
  jackson:
    time-zone: GMT+8

# Feign 超时（登录依赖 system 查询用户信息）：连接 3s / 读取 10s，
# 避免 system 无响应时登录请求长时间挂起（Spring Cloud 默认读取 60s 过长）
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000

# Actuator：克制暴露，仅 health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 认证中心 RSA 密钥（PKCS8 PEM）。网关持有同一公钥校验令牌，二者必须一致。
cornerstone:
  # 服务间内部令牌：与 cornerstone-system 共享，Feign 调用 /system/auth/** 时自动附加
  internal-token: cornerstone-internal-secret
  auth:
    rsa:
      private-key: classpath:rsa-private.pem
      public-key: classpath:rsa-public.pem
    # JWT issuer（签发到令牌的 iss 声明）：多环境部署改为生产域名，如 https://auth.example.com
    issuer: http://localhost:8081
    # 客户端注册
    client:
      client-id: cornerstone-client
      client-secret: cornerstone-secret
