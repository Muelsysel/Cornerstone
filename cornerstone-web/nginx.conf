# Cornerstone 前端 nginx 配置
# - 静态托管构建产物（SPA 路由回退 index.html）
# - /auth /system /demo 反向代理到后端网关：
#   默认 host.docker.internal:8080（后端在宿主机本地跑，容器内经 host-gateway 访问）
#   若后端也容器化（compose 内服务名 cornerstone-gateway），改为 proxy_pass http://cornerstone-gateway:8080 即可
#   前后端同源部署：浏览器只访问本 nginx，API 经 nginx 转发，无跨域问题

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：未知路径交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（保留原始路径转发到网关，网关白名单/限流/JWT 校验照常）
    location ~ ^/(auth|system|demo)/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
